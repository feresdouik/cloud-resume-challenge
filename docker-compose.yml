services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/visits.db
      CORS_ORIGINS: "*"
    volumes:
      - visitor_data:/data
    expose:
      - "8000"
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  visitor_data: